# CI en cada PR y despliegue en cada push a main: imagen → checks → dev → (aprobación) → prod.
# Secrets necesarios: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID y DOCKERHUB_TOKEN.
# Opcionales: SENTRY_DSN_API y SENTRY_DSN_WEB (sin ellos no se manda nada a Sentry).
# Variable necesaria: DOCKERHUB_USERNAME.
# El environment `prod` debe tener "Required reviewers" en GitHub para que pida aprobación.
name: CI y despliegue

on:
  pull_request:
  push:
    branches: [main]

# Un despliegue a la vez: dos `terraform apply` simultáneos se pisarían el estado en R2.
concurrency:
  group: ${{ github.event_name == 'push' && 'despliegue' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGEN: franqzd/shopsito-dev

jobs:
  # Publica en Docker Hub la imagen de trabajo. La etiqueta sale del contenido del Dockerfile:
  # si no cambió, la imagen ya existe y no se vuelve a construir.
  imagen:
    runs-on: ubuntu-latest
    outputs:
      etiqueta: ${{ steps.buscar.outputs.etiqueta }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: buscar
        run: |
          etiqueta="$(sha256sum .devcontainer/Dockerfile | cut -c1-12)"
          echo "etiqueta=$etiqueta" >>"$GITHUB_OUTPUT"
          if docker manifest inspect "$IMAGEN:$etiqueta" >/dev/null 2>&1; then
            echo "existe=true" >>"$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v4
        if: steps.buscar.outputs.existe != 'true'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        if: steps.buscar.outputs.existe != 'true'
        with:
          context: .devcontainer
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGEN }}:${{ steps.buscar.outputs.etiqueta }}
      # `latest` (la de docker compose) solo avanza desde main, no desde un PR sin revisar.
      - if: github.event_name == 'push'
        run: docker buildx imagetools create -t "$IMAGEN:latest" "$IMAGEN:${{ steps.buscar.outputs.etiqueta }}"

  checks:
    needs: imagen
    runs-on: ubuntu-latest
    container:
      image: franqzd/shopsito-dev:${{ needs.imagen.outputs.etiqueta }}
      # Con sesión para no topar con el límite de descargas anónimas de Docker Hub.
      credentials:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  deploy-dev:
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://shopsito-web-dev.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: hashicorp/setup-terraform@v3
        with:
          # Sin el wrapper, `terraform output -raw` devuelve solo el valor (lo usa desplegar.sh).
          terraform_wrapper: false
      - run: infra/desplegar.sh dev
        env:
          AUTO_APPROVE: 1
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SENTRY_DSN_API: ${{ secrets.SENTRY_DSN_API }}
          SENTRY_DSN_WEB: ${{ secrets.SENTRY_DSN_WEB }}

  deploy-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    # Aquí se detiene hasta que alguien apruebe en GitHub (Required reviewers del environment).
    environment:
      name: prod
      url: https://shopsito-web-prod.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: infra/desplegar.sh prod
        env:
          AUTO_APPROVE: 1
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SENTRY_DSN_API: ${{ secrets.SENTRY_DSN_API }}
          SENTRY_DSN_WEB: ${{ secrets.SENTRY_DSN_WEB }}
